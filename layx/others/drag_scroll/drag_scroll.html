<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Drag Scroll</title>

        <style>
            body {
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }

            .container {
                display: flex;
                flex-direction: column;
                gap: 2rem;
                padding: 1.5rem;
                box-sizing: border-box;
            }

            .scrollable {
                display: flex;
                gap: 1rem;
                max-width: 100%;
                max-height: 50vh;
                box-sizing: border-box;

                &.x {
                    overflow-x: auto;

                    .scrollable__item {
                        height: 40vh;
                        width: 50%;
                        flex-shrink: 0;
                    }
                }

                &.y {
                    flex-direction: column;
                    overflow-y: auto;

                    .scrollable__item {
                        height: 25vh;
                        flex-shrink: 0;
                    }
                }

                &.both {
                    flex-wrap: nowrap;
                    width: 100%;
                    height: 50vh;
                    overflow: auto;

                    .scrollable__item {
                        height: 80vh;
                        width: 60%;
                        flex-shrink: 0;
                    }
                }

                .scrollable__item {
                    display: grid;
                    place-content: center;
                    background-color: aliceblue;
                    border-radius: 4px;
                    font-size: 1.1rem;
                    color: #333;
                    user-select: none;
                }
            }

            .scrollable__item button {
                margin-top: 0.5rem;
                padding: 0.35rem 0.75rem;
                font-size: 0.85rem;
                cursor: pointer;
                border: 1px solid #cbd5e1;
                border-radius: 4px;
                background-color: #fff;
            }

            .scrollable__item button:hover {
                background-color: #f8fafc;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="scrollable x" data-drag-scroll="x" data-drag-scroll-momentum>
                <div class="scrollable__item">
                    <span>Item 1</span>
                    <button type="button" onclick="alert('Nested button clicked!')">Click test</button>
                </div>
                <div class="scrollable__item">Item 2</div>
                <div class="scrollable__item">Item 3</div>
                <div class="scrollable__item">Item 4</div>
            </div>
            <div class="scrollable y" data-drag-scroll="y" data-drag-scroll-momentum>
                <div class="scrollable__item">Item 1</div>
                <div class="scrollable__item">Item 2</div>
                <div class="scrollable__item">Item 3</div>
                <div class="scrollable__item">Item 4</div>
            </div>
            <div class="scrollable both" data-drag-scroll="both" data-drag-scroll-momentum>
                <div class="scrollable__item">Item 1</div>
                <div class="scrollable__item">Item 2</div>
                <div class="scrollable__item">Item 3</div>
            </div>
        </div>
        <script src="drag_scroll.js" type="module"></script>
    </body>

</html>
